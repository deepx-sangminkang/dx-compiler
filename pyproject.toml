# AUTO-GENERATED by scripts/lock_project.sh from compiler.properties.
# Do not edit by hand: rerun ./scripts/lock_project.sh after bumping COM_VERSION.
#
# This project exists solely to produce uv.lock for the pinned install path
# (`install.sh --uv=true --pypi=false`). The PyPI path stays deliberately
# unpinned and does not use this lock.
[project]
name = "dx-compiler-env"
version = "0.0.0"
description = "Locked dependency set for the dx-compiler pinned install path"
requires-python = ">=3.8"
dependencies = [
    "dx-com==2.4.0",
    # Required by scripts/downloader.py (install.sh:544-545). Must be listed
    # here or `uv sync` would remove them from the environment.
    "requests",
    "beautifulsoup4",
]

[tool.uv]
# This repository is an installer, not a distributable package. Without this,
# uv tries to build the repo itself and fails for lack of a [build-system].
package = false
# Mirrors install.sh's COM_FIND_LINKS for the --pypi=false path.
find-links = ["https://sdk.deepx.ai/release/dxcom/v2.4.0/index.html"]
